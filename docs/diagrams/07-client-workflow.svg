<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" width="920" height="650" role="img" aria-labelledby="07-client-workflow-title 07-client-workflow-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="07-client-workflow-title">Cấp quyền và gửi lệnh</title>
<desc id="07-client-workflow-desc">Quản trị cấp máy và chuyển khóa. Client chọn file, gửi rồi xem kết quả. Mất phản hồi cần giữ yêu cầu gốc; tải lại không tự gửi.</desc>
<defs><marker id="07-client-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="460,100 460,138" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<polyline points="460,218 460,258" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<polyline points="675,300 720,300" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<polyline points="460,340 460,382" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<polyline points="335,433 225,433 225,527" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<polyline points="585,433 690,433 690,527" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#07-client-workflow-arrow)"/>
<g data-box="true"><rect x="245" y="20" width="430" height="80" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="54" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Quản trị tạo client và cấp máy</tspan></text><text x="460" y="82" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Sao chép khóa truy cập một lần</tspan></text></g>
<g data-box="true"><rect x="245" y="138" width="430" height="80" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="172" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Ứng dụng kết nối bằng khóa</tspan></text><text x="460" y="200" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Tải máy được cấp + lịch sử</tspan></text></g>
<g data-box="true"><rect x="245" y="258" width="430" height="82" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="460" y="293" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Chọn máy • file • số bản • lựa chọn</tspan></text><text x="460" y="321" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Bấm gửi = yêu cầu in thật</tspan></text></g>
<g data-box="true"><rect x="720" y="250" width="175" height="102" rx="12" fill="#fcf0ef" stroke="#d4a09b" stroke-width="1.5"/><text x="807" y="283" fill="#853d36" font-size="17" font-weight="650" text-anchor="middle"><tspan x="807" dy="0">Lỗi xác định</tspan></text><text x="807" y="311" fill="#853d36" font-size="16" font-weight="400" text-anchor="middle"><tspan x="807" dy="0">Đọc thông báo lỗi</tspan><tspan x="807" dy="23">Không tự đổi mã</tspan></text></g>
<text x="697" y="282" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="697" dy="0">Lỗi</tspan></text>
<polygon points="460,382 585,433 460,484 335,433" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/>
<text x="460" y="439" fill="#243849" font-size="17" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Có phản hồi nhận?</tspan></text>
<g data-box="true"><rect x="35" y="527" width="385" height="96" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="227" y="557" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="227" dy="0">Có mã lệnh</tspan></text><text x="227" y="585" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="227" dy="0">Xem trạng thái / lịch sử</tspan><tspan x="227" dy="23">Không tạo lệnh mới để kiểm tra</tspan></text></g>
<text x="265" y="412" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="265" dy="0">Có</tspan></text>
<g data-box="true"><rect x="500" y="527" width="385" height="96" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="692" y="557" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="692" dy="0">Mất phản hồi</tspan></text><text x="692" y="585" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="692" dy="0">Còn tab → gửi lại yêu cầu gốc</tspan><tspan x="692" dy="23">Mất dữ liệu → lịch sử + đối soát</tspan></text></g>
<text x="658" y="412" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="658" dy="0">Chưa rõ</tspan></text>
<text x="125" y="384" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="125" dy="0">Tab ghi nhớ khóa truy cập.</tspan><tspan x="125" dy="22">Tải lại không tự gửi lệnh.</tspan></text>
</svg>
