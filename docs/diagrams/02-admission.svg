<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760" role="img" aria-labelledby="02-admission-title 02-admission-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="02-admission-title">Tiếp nhận và chống gửi trùng</title>
<desc id="02-admission-desc">Cùng mã và nội dung trả lệnh cũ; khác nội dung báo xung đột. Yêu cầu mới phải hợp lệ và được lưu an toàn trước khi báo đã nhận.</desc>
<defs><marker id="02-admission-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="460,98 460,132" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="460,212 460,245" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="310,305 250,305" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="460,365 460,408" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="665,458 710,458" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="460,508 460,552" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<polyline points="460,647 460,685" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#02-admission-arrow)"/>
<g data-box="true"><rect x="255" y="20" width="410" height="78" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="53" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Nhận yêu cầu in mới</tspan></text><text x="460" y="81" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Khóa truy cập + mã yêu cầu + file</tspan></text></g>
<g data-box="true"><rect x="255" y="132" width="410" height="80" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="166" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Xác thực và kiểm đầu vào</tspan></text><text x="460" y="194" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Tạo dấu nhận dạng của yêu cầu</tspan></text></g>
<polygon points="460,245 610,305 460,365 310,305" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/>
<text x="460" y="299" fill="#243849" font-size="17" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Mã yêu cầu đã có?</tspan><tspan x="460" dy="24">Trong phạm vi ứng dụng gửi</tspan></text>
<g data-box="true"><rect x="30" y="250" width="220" height="112" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="140" y="288" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="140" dy="0">Đã có</tspan></text><text x="140" y="316" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="140" dy="0">Dấu khớp → lệnh cũ</tspan><tspan x="140" dy="23">Dấu khác → lỗi 409</tspan></text></g>
<text x="278" y="283" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="278" dy="0">Có</tspan></text>
<g data-box="true"><rect x="255" y="408" width="410" height="100" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="440" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Kiểm tra yêu cầu mới</tspan></text><text x="460" y="468" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Được cấp máy • đúng cấu hình</tspan><tspan x="460" dy="23">Lựa chọn hợp lệ • còn sức chứa</tspan></text></g>
<text x="530" y="390" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="530" dy="0">Chưa có</tspan></text>
<g data-box="true"><rect x="710" y="408" width="185" height="100" rx="12" fill="#fcf0ef" stroke="#d4a09b" stroke-width="1.5"/><text x="802" y="440" fill="#853d36" font-size="17" font-weight="650" text-anchor="middle"><tspan x="802" dy="0">Không hợp lệ</tspan></text><text x="802" y="468" fill="#853d36" font-size="16" font-weight="400" text-anchor="middle"><tspan x="802" dy="0">Trả mã lỗi</tspan><tspan x="802" dy="23">Không nhận lệnh</tspan></text></g>
<g data-box="true"><rect x="255" y="552" width="410" height="95" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="460" y="581" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Lưu bền vững</tspan></text><text x="460" y="609" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Lưu file và lệnh trước phản hồi</tspan><tspan x="460" dy="23">Giữ cấu hình tại thời điểm nhận</tspan></text></g>
<text x="500" y="536" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">Đạt</tspan></text>
<g data-box="true"><rect x="255" y="685" width="410" height="55" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="460" y="718" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">202 + mã lệnh: đã nhận, chưa phải đã in</tspan></text></g>
<text x="783" y="610" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="783" dy="0">Quyền được kiểm lại</tspan><tspan x="783" dy="22">khi ghi nhận lệnh.</tspan></text>
</svg>
