<polyline points="690,431 690,461 570,461 570,491" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
<g data-box="true"><rect x="60" y="25" width="340" height="96" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="230" y="55" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">CUPS và driver</tspan></text><text x="230" y="83" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">Lựa chọn • mặc định • ràng buộc</tspan><tspan x="230" dy="23">Khả năng máy được công bố</tspan></text></g>
<g data-box="true"><rect x="520" y="25" width="340" height="96" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="690" y="55" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Quản trị máy</tspan></text><text x="690" y="83" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Mặc định trên thiết bị</tspan><tspan x="690" dy="23">Các giá trị ứng dụng được chọn</tspan></text></g>
<g data-box="true"><rect x="240" y="181" width="440" height="96" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="211" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Bộ lựa chọn theo máy</tspan></text><text x="460" y="239" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Chỉ lựa chọn phù hợp và được cấp</tspan><tspan x="460" dy="23">Dấu cấu hình để nhận biết thay đổi</tspan></text></g>
<g data-box="true"><rect x="60" y="337" width="340" height="94" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="230" y="366" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">Ứng dụng chọn</tspan></text><text x="230" y="394" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">Dùng mặc định → không ghi đè</tspan><tspan x="230" dy="23">Chọn khác → phải được cấp quyền</tspan></text></g>
<g data-box="true"><rect x="520" y="337" width="340" height="94" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="690" y="366" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Thiết bị kiểm tra</tspan></text><text x="690" y="394" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Đúng giá trị • tổ hợp • cấu hình</tspan><tspan x="690" dy="23">Không chỉ dựa vào biểu mẫu</tspan></text></g>
<g data-box="true"><rect x="240" y="491" width="440" height="85" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="460" y="527" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Cấu hình giữ cho lệnh</tspan></text><text x="460" y="555" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Lựa chọn không tự đổi sau khi nhận</tspan></text></g>
