<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 655" width="920" height="655" role="img" aria-labelledby="08-unknown-resolution-title 08-unknown-resolution-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="08-unknown-resolution-title">Đối soát chưa rõ kết quả</title>
<desc id="08-unknown-resolution-desc">Giữ file và chặn máy; kiểm mã CUPS, dấu nhận diện và trạng thái. Bằng chứng đủ thì quản trị ghi kết quả có lý do. Không tự gửi lại file.</desc>
<defs><marker id="08-unknown-resolution-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="460,105 460,147" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#08-unknown-resolution-arrow)"/>
<polyline points="460,232 460,275" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#08-unknown-resolution-arrow)"/>
<polyline points="305,335 230,335 230,442" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#08-unknown-resolution-arrow)"/>
<polyline points="615,335 690,335 690,442" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#08-unknown-resolution-arrow)"/>
<g data-box="true"><rect x="255" y="20" width="410" height="85" rx="12" fill="#fcf0ef" stroke="#d4a09b" stroke-width="1.5"/><text x="460" y="56" fill="#853d36" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">unknown: giữ file, chặn máy</tspan></text><text x="460" y="84" fill="#853d36" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Thiếu lịch sử không phải là chưa in</tspan></text></g>
<g data-box="true"><rect x="255" y="147" width="410" height="85" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="183" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Đọc CUPS có xác thực</tspan></text><text x="460" y="211" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Mã CUPS + dấu nhận diện + trạng thái</tspan></text></g>
<polygon points="460,275 615,335 460,395 305,335" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/>
<text x="460" y="329" fill="#243849" font-size="17" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Đúng lệnh cần đối soát</tspan><tspan x="460" dy="24">và đã kết thúc?</tspan></text>
<g data-box="true"><rect x="35" y="442" width="390" height="108" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="230" y="478" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">Bằng chứng đủ</tspan></text><text x="230" y="506" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">Quản trị ghi kết quả + lý do</tspan><tspan x="230" dy="23">Hoàn thành / lỗi / đã hủy</tspan></text></g>
<text x="258" y="314" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="258" dy="0">Có</tspan></text>
<g data-box="true"><rect x="495" y="442" width="390" height="108" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="690" y="478" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Chưa đủ bằng chứng</tspan></text><text x="690" y="506" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Chưa kết thúc: xử lý và kiểm lại</tspan><tspan x="690" dy="23">Thiếu lịch sử: đối soát thực tế</tspan></text></g>
<text x="662" y="314" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="662" dy="0">Không</tspan></text>
<text x="460" y="602" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Sai dấu nhận diện: giữ unknown, không lấy kết quả từ một lệnh CUPS khác.</tspan><tspan x="460" dy="22">Ghi kết quả có bằng chứng, không tự gửi lại file.</tspan></text>
</svg>
