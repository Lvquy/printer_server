<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 635" width="920" height="635" role="img" aria-labelledby="connection-title connection-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="connection-title">Sơ đồ kết nối</title>
<desc id="connection-desc">Ứng dụng và quản trị kết nối qua LAN tới EDATEC. Print Appliance gọi CUPS nội bộ; CUPS dùng driver để gửi dữ liệu tới máy in USB hoặc LAN.</desc>
<defs><marker id="connection-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<rect x="200" y="165" width="520" height="275" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/>
<polyline points="220,110 220,145 350,145 350,215" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#connection-arrow)"/>
<polyline points="700,110 700,145 570,145 570,215" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#connection-arrow)"/>
<polyline points="460,285 460,335" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#connection-arrow)"/>
<polyline points="350,405 350,455 210,455 210,495" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#connection-arrow)"/>
<polyline points="570,405 570,455 710,455 710,495" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#connection-arrow)"/>
<text x="460" y="195" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Thiết bị quản lý in</tspan></text>
<g data-box="true"><rect x="20" y="20" width="400" height="90" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="220" y="59" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="220" dy="0">Máy tính / ứng dụng</tspan></text><text x="220" y="87" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Gửi tài liệu cần in</tspan></text></g>
<g data-box="true"><rect x="500" y="20" width="400" height="90" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="700" y="59" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="700" dy="0">Người quản trị</tspan></text><text x="700" y="87" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">Dùng trình duyệt web</tspan></text></g>
<g data-box="true"><rect x="230" y="215" width="460" height="70" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="460" y="244" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Print Appliance</tspan></text><text x="460" y="272" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Nhận và theo dõi lệnh in</tspan></text></g>
<g data-box="true"><rect x="230" y="335" width="460" height="70" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="364" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">CUPS + driver</tspan></text><text x="460" y="392" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Chuyển tài liệu tới máy in</tspan></text></g>
<g data-box="true"><rect x="40" y="495" width="340" height="85" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="210" y="531" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="210" dy="0">Máy in USB</tspan></text><text x="210" y="559" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">Nối trực tiếp bằng cáp USB</tspan></text></g>
<g data-box="true"><rect x="540" y="495" width="340" height="85" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="710" y="531" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="710" dy="0">Máy in mạng</tspan></text><text x="710" y="559" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">Kết nối cùng mạng nội bộ</tspan></text></g>
<text x="460" y="145" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Web / API qua mạng</tspan></text>
