<text x="210" y="478" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="210" dy="0">USB</tspan></text>
<text x="710" y="478" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">LAN</tspan></text>
<text x="460" y="615" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Thiết bị nhận lệnh; máy in tạo bản in trên giấy</tspan></text>
</svg>
