<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 715" width="920" height="715" role="img" aria-labelledby="09-backup-restore-title 09-backup-restore-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="09-backup-restore-title">Sao lưu và phục hồi</title>
<desc id="09-backup-restore-desc">Backup khi được phép; kiểm lệnh, dừng, bảo vệ bản sao và lưu ngoài thiết bị. Restore cần đối soát, giữ dừng và kiểm trước khi cho chạy.</desc>
<defs><marker id="09-backup-restore-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="232,217 232,254" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="232,352 232,389" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="232,487 232,524" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,217 687,254" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,352 687,389" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,487 687,524" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<g data-box="true"><rect x="35" y="20" width="395" height="62" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="232" y="57" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">BACKUP ĐẦY ĐỦ</tspan></text></g>
<g data-box="true"><rect x="490" y="20" width="395" height="62" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="57" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">RESTORE CÓ KIỂM SOÁT</tspan></text></g>
<g data-box="true"><rect x="35" y="119" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="150" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Maintenance được phép</tspan></text><text x="232" y="178" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">App không còn lệnh chưa kết thúc</tspan><tspan x="232" dy="23">CUPS không có lệnh chờ</tspan></text></g>
<g data-box="true"><rect x="35" y="254" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="285" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Stop service và kiểm lại</tspan></text><text x="232" y="313" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Tránh bỏ sót lệnh vừa nhận</tspan><tspan x="232" dy="23">Sao lưu nhất quán, không chép rời file</tspan></text></g>
<g data-box="true"><rect x="35" y="389" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="420" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Bản sao được bảo vệ</tspan></text><text x="232" y="448" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Lệnh + file + cấu hình + phiên bản</tspan><tspan x="232" dy="23">Kiểm bản sao • lưu ngoài thiết bị</tspan></text></g>
<g data-box="true"><rect x="35" y="524" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="555" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Start service sau backup</tspan></text><text x="232" y="583" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Kiểm dịch vụ sẵn sàng</tspan><tspan x="232" dy="23">Driver có kế hoạch sao lưu riêng</tspan></text></g>
<g data-box="true"><rect x="490" y="119" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="150" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Duyệt quyết định restore</tspan></text><text x="687" y="178" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Đối soát lệnh nhận sau backup</tspan><tspan x="687" dy="23">Backup trạng thái hiện tại</tspan></text></g>
<g data-box="true"><rect x="490" y="254" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="285" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Giữ service dừng</tspan></text><text x="687" y="313" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Phục hồi dữ liệu đúng phạm vi</tspan><tspan x="687" dy="23">Dùng phiên bản tương thích</tspan></text></g>
<g data-box="true"><rect x="490" y="389" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="420" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Kiểm trước khi cho chạy</tspan></text><text x="687" y="448" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Toàn vẹn • cấu hình • lệnh chờ</tspan><tspan x="687" dy="23">Chưa đạt → giữ dừng, đối soát</tspan></text></g>
<g data-box="true"><rect x="490" y="524" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="555" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Start chỉ khi đủ điều kiện</tspan></text><text x="687" y="583" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Không coi backup cũ là chưa in</tspan><tspan x="687" dy="23">Giữ bản trước phục hồi</tspan></text></g>
<text x="460" y="691" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Bản sao chỉ có thông tin lệnh không đủ phục hồi file. Cần đối soát kết quả in.</tspan></text>
</svg>
