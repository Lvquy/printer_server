<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 485" width="920" height="485" role="img" aria-labelledby="05-printer-fifo-title 05-printer-fifo-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="05-printer-fifo-title">Hàng đợi theo máy</title>
<desc id="05-printer-fifo-desc">Mỗi máy đăng ký có thứ tự riêng. Các máy khác xử lý độc lập. Unknown chặn máy liên quan; nhiều đăng ký một máy thật không tạo thứ tự chung.</desc>
<defs><marker id="05-printer-fifo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="260,85 315,85" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#05-printer-fifo-arrow)"/>
<polyline points="585,85 650,85" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#05-printer-fifo-arrow)"/>
<polyline points="260,220 315,220" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#05-printer-fifo-arrow)"/>
<polyline points="585,220 650,220" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#05-printer-fifo-arrow)"/>
<polyline points="260,355 315,355" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#05-printer-fifo-arrow)"/>
<g data-box="true"><rect x="25" y="40" width="235" height="90" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="142" y="79" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="142" dy="0">Máy đăng ký A</tspan></text><text x="142" y="107" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="142" dy="0">Thứ tự tiếp nhận: FIFO</tspan></text></g>
<g data-box="true"><rect x="315" y="40" width="270" height="90" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="450" y="79" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">A1 → A2 → A3</tspan></text><text x="450" y="107" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">Một lệnh đang giao / theo dõi</tspan></text></g>
<g data-box="true"><rect x="650" y="40" width="245" height="90" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="772" y="79" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="772" dy="0">CUPS / máy A</tspan></text><text x="772" y="107" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="772" dy="0">Xử lý độc lập</tspan></text></g>
<g data-box="true"><rect x="25" y="175" width="235" height="90" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="142" y="214" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="142" dy="0">Máy đăng ký B</tspan></text><text x="142" y="242" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="142" dy="0">Thứ tự tiếp nhận: FIFO</tspan></text></g>
<g data-box="true"><rect x="315" y="175" width="270" height="90" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="450" y="214" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">B1 → B2 → B3</tspan></text><text x="450" y="242" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">Một lệnh đang giao / theo dõi</tspan></text></g>
<g data-box="true"><rect x="650" y="175" width="245" height="90" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="772" y="214" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="772" dy="0">CUPS / máy B</tspan></text><text x="772" y="242" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="772" dy="0">Xử lý độc lập</tspan></text></g>
<g data-box="true"><rect x="25" y="310" width="235" height="90" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="142" y="349" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="142" dy="0">Máy đăng ký C</tspan></text><text x="142" y="377" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="142" dy="0">Thứ tự tiếp nhận: FIFO</tspan></text></g>
<g data-box="true"><rect x="315" y="310" width="270" height="90" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="450" y="349" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">C1 unknown • C2 chờ</tspan></text><text x="450" y="377" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">Chặn máy C; không gửi lại</tspan></text></g>
<g data-box="true"><rect x="650" y="310" width="245" height="90" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="772" y="349" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="772" dy="0">CUPS / máy C</tspan></text><text x="772" y="377" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="772" dy="0">Đối soát thủ công</tspan></text></g>
<text x="460" y="448" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Tối đa 4 máy mỗi vòng. Hai đăng ký cùng một máy vật lý không có FIFO chung.</tspan></text>
</svg>
