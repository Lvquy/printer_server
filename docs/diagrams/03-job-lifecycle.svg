<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-labelledby="03-job-lifecycle-title 03-job-lifecycle-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="03-job-lifecycle-title">Vòng đời lệnh in</title>
<desc id="03-job-lifecycle-desc">Chờ, giao, theo dõi rồi ghi kết quả. Lệnh giữ cần quản trị cho tiếp tục. Unknown cần đối soát, không tự gửi lại. Sơ đồ rút gọn.</desc>
<defs><marker id="03-job-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="265,93 345,93" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="575,93 655,93" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="150,136 150,225" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="65,225 65,172 55,172 55,136" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="460,136 460,225" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="770,136 770,180 530,180 530,225" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="840,136 905,136 905,279 885,279" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<polyline points="575,279 655,279" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#03-job-lifecycle-arrow)"/>
<g data-box="true"><rect x="35" y="50" width="230" height="86" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="150" y="87" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="150" dy="0">queued</tspan></text><text x="150" y="115" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="150" dy="0">Đã nhận, chờ FIFO</tspan></text></g>
<g data-box="true"><rect x="345" y="50" width="230" height="86" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="460" y="87" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">submitting</tspan></text><text x="460" y="115" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Ý định giao đã lưu</tspan></text></g>
<g data-box="true"><rect x="655" y="50" width="230" height="86" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="770" y="87" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="770" dy="0">submitted</tspan></text><text x="770" y="115" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="770" dy="0">Có mã CUPS; theo dõi</tspan></text></g>
<g data-box="true"><rect x="35" y="225" width="230" height="108" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="150" y="261" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="150" dy="0">held</tspan></text><text x="150" y="289" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="150" dy="0">Giữ do lỗi hoặc cấu hình</tspan><tspan x="150" dy="23">Quản trị cho tiếp tục</tspan></text></g>
<text x="235" y="184" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="235" dy="0">Giữ trước giao</tspan></text>
<g data-box="true"><rect x="345" y="225" width="230" height="108" rx="12" fill="#fcf0ef" stroke="#d4a09b" stroke-width="1.5"/><text x="460" y="261" fill="#853d36" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">unknown</tspan></text><text x="460" y="289" fill="#853d36" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Chưa rõ kết quả</tspan><tspan x="460" dy="23">Chặn tiến trình máy</tspan></text></g>
<g data-box="true"><rect x="655" y="225" width="230" height="108" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="770" y="261" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="770" dy="0">Kết quả cuối</tspan></text><text x="770" y="289" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="770" dy="0">completed / failed</tspan><tspan x="770" dy="23">canceled</tspan></text></g>
<text x="615" y="260" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="615" dy="0">Đối soát</tspan></text>
<g data-box="true"><rect x="95" y="395" width="730" height="88" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="421" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Các nhánh khác</tspan></text><text x="460" y="449" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">queued / held có thể hủy trước giao; lỗi xác định có thể kết thúc failed.</tspan><tspan x="460" dy="23">Hủy sau giao cần đối chiếu kết quả CUPS, không hứa thu hồi giấy.</tspan></text></g>
<g data-box="true"><rect x="95" y="528" width="730" height="78" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="460" y="561" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Giới hạn bảo đảm</tspan></text><text x="460" y="589" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">completed là CUPS báo hoàn thành, không phải chứng minh đã ra giấy.</tspan></text></g>
</svg>
