[project]
name = "print-appliance"
version = "0.1.5"
description = "A local, single-node print appliance backed by CUPS and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
cups = ["pycups>=2.0.4"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
print-appliance = "print_appliance.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print_appliance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
